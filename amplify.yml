version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps
        - |
          printf "DATABASE_URL=%s\nPOSTGRES_URL_NON_POOLING=%s\nAUTH_SECRET=%s\nDATABASE_URL=%s\nS3_REGION=%s\nS3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\nS3_BUCKET_NAME=%s\nAUTH_URL=%s\nNEXT_PUBLIC_APP_URL=%s\nSMTP_USER=%s\nSMTP_PASS=%s\n" "$DATABASE_URL" "$POSTGRES_URL_NON_POOLING" "$AUTH_SECRET" "$DATABASE_URL" "$S3_REGION" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" "$S3_BUCKET_NAME" "$AUTH_URL" "$NEXT_PUBLIC_APP_URL" "$SMTP_USER" "$SMTP_PASS" > .env.production || true
        - cat .env.production || true
        - npx prisma generate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
